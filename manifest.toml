# Sioul's extensions: the list Sioul reads (docs/extensions.md in Sioul's
# repository). Signed by hand, detached, into manifest.toml.sig (README.md,
# "Making a release"); Sioul refuses it unsigned, or signed by another key.
format = 1
# Grows by one with each manifest signed: Sioul refuses a lower one than the
# last it accepted, so that an older manifest cannot be served again.
serial = 3

[[extension]]
id = "skolengo"
version = "0.1.0"
interface = 1
name = { en = "Skolengo timetable (unofficial)", fr = "Emploi du temps Skolengo (non officiel)" }
about = { en = "Each pupil's lessons, from a week back to four weeks ahead, from a school platform built on Skolengo (any of those it lists): one read-only agenda per pupil. Not the vendor's: a port of community clients.", fr = "Les cours de chaque élève, d’une semaine en arrière à quatre semaines en avant, depuis un ENT bâti sur Skolengo (l’un de ceux qu’elle liste) : un agenda en lecture seule par élève. Pas celle de l’éditeur : un portage de clients communautaires." }
brings = ["agenda"]
hosts = [
    "api.skolengo.com",
    "sso.monbureaunumerique.fr",
    "sso.mon-ent-occitanie.fr",
    "sso.arsene76.fr",
    "sso.ent27.fr",
    "sso.entcreuse.fr",
    "sso.ent.auvergnerhonealpes.fr",
    "sso.agora06.fr",
    "sso.cybercolleges42.fr",
    "sso.ecollege.haute-garonne.fr",
    "sso.moncollege.valdoise.fr",
    "sso.webcollege.seinesaintdenis.fr",
    "sso.eclat-bfc.fr",
    "sso.aucollege84.vaucluse.fr",
    "sso.moncollege.valdemarne.fr",
    "sso.skolengo.com",
    "sso.pdl.kosmoseducation.com",
    "sso1.skolengo.com",
    "sso2.skolengo.com",
    "sso.schulen.be",
]
sign_in = "skoapp-prod://sign-in-callback"
# Written at each release from the publisher's own build, signed only when the
# automation's is the same (README.md); this hash is that of tools/build.sh with
# Rust 1.99.0 at the commit that tags skolengo-0.1.0.
file = "https://github.com/aurelienpierre/sioul-extensions/releases/download/skolengo-0.1.0/skolengo-0.1.0.wasm"
sha256 = "0145940e902dcd5d1191a38191b11faf1c60afbbd5c36a680a1a1f6da1eec3fe"

[[extension]]
id = "planity"
version = "0.2.1"
interface = 1
name = { en = "Planity appointments (unofficial)", fr = "Rendez-vous Planity (non officiel)" }
about = { en = "A Planity Pro salon's appointments, from sixty days back to a hundred and twenty ahead, as one read-only agenda of busy time, into a calendar you choose. Each appointment carries its services as categories, and is tied to its client's card. Each booking joins what Planity's own calendar export gives (the services, the prices, the cancellations, the recurring bookings) with what the salon's agenda gives (the client's name and phone, the note, the older bookings). You sign in with the salon's email and password and paste the calendar's web address (its export link, in Planity Pro's settings), which Sioul collects in its own form; only a refresh token and that address are kept, never the password. The clients seen in those appointments come too, with their phone and email address, into an address book you choose: Sioul only adds to it, and never deletes a card. Not Planity's: an independent, read-only client.", fr = "Les rendez-vous d’un salon Planity Pro, de soixante jours en arrière à cent vingt en avant, en un agenda en lecture seule de temps occupé, dans un calendrier que vous choisissez. Chaque rendez-vous porte ses prestations comme catégories, et est relié à la fiche de son client. Chaque réservation réunit ce que donne l’export de calendrier de Planity (les prestations, les prix, les annulations, les rendez-vous récurrents) et ce que donne l’agenda du salon (le nom et le téléphone du client, la note, les réservations plus anciennes). Vous vous connectez avec l’e-mail et le mot de passe du salon et collez l’adresse web du calendrier (son lien d’export, dans les réglages de Planity Pro), que Sioul recueille dans son propre formulaire ; seuls un jeton de renouvellement et cette adresse sont gardés, jamais le mot de passe. Les clients vus dans ces rendez-vous viennent aussi, avec leur téléphone et leur adresse e-mail, dans un carnet d’adresses que vous choisissez : Sioul ne fait qu’y ajouter, et ne supprime jamais une fiche. Pas celui de Planity : un client indépendant, en lecture seule." }
brings = ["agenda", "contacts"]
hosts = [
    "identitytoolkit.googleapis.com",
    "securetoken.googleapis.com",
    "firestore.googleapis.com",
    "product.api.euwest1.prod.planityapp.com",
]
credentials = ["email", "password", "web-address"]
# Written at each release from the publisher's own build, signed only when the
# automation's is the same (README.md); this hash is that of tools/build.sh with
# Rust 1.99.0 at the commit that tags planity-0.2.1.
file = "https://github.com/aurelienpierre/sioul-extensions/releases/download/planity-0.2.1/planity-0.2.1.wasm"
sha256 = "a270fd7fab75f26f2c56e17aac66a2e13074155a7b0d806d6b1673f65e878bf1"

[extension.fields.web-address]
label = { en = "iCal private link", fr = "Lien iCal privé" }
help = { en = "In Planity Pro: the Admin tab, then « Paramètres Agenda » in the list on the left, « Gestion des agendas », then the link « Synchroniser avec partenaires » at the top.", fr = "Dans Planity Pro : l’onglet Admin, puis « Paramètres Agenda » dans la liste de gauche, « Gestion des agendas », puis le lien « Synchroniser avec partenaires » en haut." }
