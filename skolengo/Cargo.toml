[package]
name = "skolengo"
description = "A pupil's timetable from a school platform built on Skolengo, for Sioul: unofficial, not the vendor's."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The cdylib is the extension's file (wasm32-unknown-unknown); the rlib, its tests on a computer.
crate-type = ["cdylib", "rlib"]

[dependencies]
sioul-extension = { path = "../sioul-extension" }
serde.workspace = true
serde_json.workspace = true
# Dates in the school's own zone (the window of days asked, a day the server
# failed on): its zone database is built into the file, the same on every system.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
