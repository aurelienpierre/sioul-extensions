# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "3"
members = ["sioul-extension", "skolengo"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# What goes into an extension's file (tools/build.sh): small, one unit, no
# debug information, no path of the computer that built it, a panic ends
# the call (Sioul says it in one sentence).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false
